<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crop Library — AgriSense</title>
<meta name="description" content="Browse cultivation guides for 26 major crops including cereals, legumes, vegetables, fruits and cash crops.">
<link rel="stylesheet" href="../CSS/global.css">
<link rel="stylesheet" href="../CSS/crops.css">
<link rel="stylesheet" href="../chatbot/chatbot.css">
</head>
<body data-page="crops">

<div id="loader" aria-hidden="true">
  <div class="loader-logo">A</div>
  <div class="loader-bar"><div class="loader-bar-fill"></div></div>
  <div class="loader-text">Gathering crop data</div>
</div>

<a class="skip-link" href="#main">Skip to content</a>
<div id="navbar-placeholder"></div>

<main id="main">
  <section class="page-hero">
    <div class="blob" style="width:340px;height:340px;top:-100px;right:-80px;background:var(--green-400);"></div>
    <div class="container text-center reveal in">
      <span class="eyebrow">Crop Library</span>
      <h1>Every crop, one complete guide</h1>
      <p class="page-hero-sub">Planting windows, soil needs, pests, diseases, market prices and community, for 26 major crops.</p>
      <div class="search-bar">
        <input type="search" id="crop-search" placeholder="Search crops (e.g. maize, tea, avocado)" aria-label="Search crops">
      </div>
    </div>
  </section>

  <section class="section" style="padding-top:0;">
    <div class="container">
      <div class="pd-filters reveal" id="category-filters"></div>
      <div class="grid-4" id="crop-grid"></div>
      <p id="crop-empty" class="text-center" style="display:none; margin-top:24px;">No crops match your search.</p>
    </div>
  </section>
</main>

<div id="footer-placeholder"></div>

<script src="../JS/global.js" defer></script>
<script src="../JS/components.js" defer></script>
<script type="module" src="../JS/notification-bell.js"></script>
<script type="module" src="../JS/crops-list-render.js"></script>
<script src="../chatbot/config.example.js" defer></script>
<script src="../chatbot/gemini.js" defer></script>
<script src="../chatbot/chatbot.js" defer></script>
</body>
</html>
