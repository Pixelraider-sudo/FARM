<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Disease Library — AgriSense</title>
<meta name="description" content="Searchable disease library covering symptoms, causes, diagnosis, treatment and prevention.">
<link rel="stylesheet" href="../CSS/global.css">
<link rel="stylesheet" href="../CSS/crops.css">
<link rel="stylesheet" href="../chatbot/chatbot.css">
</head>
<body data-page="diseases">
<div id="loader" aria-hidden="true">
  <div class="loader-logo">A</div>
  <div class="loader-bar"><div class="loader-bar-fill"></div></div>
  <div class="loader-text">Gathering disease data</div>
</div>
<a class="skip-link" href="#main">Skip to content</a>
<div id="navbar-placeholder"></div>
<main id="main">
  <section class="page-hero">
    <div class="blob" style="width:300px;height:300px;top:-90px;right:-80px;background:#b91c1c;"></div>
    <div class="container text-center reveal in">
      <span class="eyebrow">Disease Library</span>
      <h1>Diagnose and treat crop diseases</h1>
      <p class="page-hero-sub">Symptoms, causes, organic and chemical treatment, and prevention for common crop diseases.</p>
      <div class="search-bar">
        <input type="search" id="disease-search" placeholder="Search diseases (e.g. blight, wilt, rust)" aria-label="Search diseases">
      </div>
    </div>
  </section>
  <section class="section" style="padding-top:0;">
    <div class="container">
      <div class="pd-filters reveal" id="category-filters"></div>
      <div class="grid-4" id="disease-grid"></div>
      <p id="disease-empty" class="text-center" style="display:none; margin-top:24px;">No diseases match your search.</p>
    </div>
  </section>
</main>
<div id="footer-placeholder"></div>
<script src="../JS/global.js" defer></script>
<script src="../JS/components.js" defer></script>
<script type="module" src="../JS/notification-bell.js"></script>
<script type="module" src="../JS/diseases-list-render.js"></script>
<script src="../chatbot/config.example.js" defer></script>
<script src="../chatbot/gemini.js" defer></script>
<script src="../chatbot/chatbot.js" defer></script>
</body>
</html>
